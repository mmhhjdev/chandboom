```yaml
name: Deploy Chandboom to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Chandboom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint --if-present

      - name: Create Environment File
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAPGPT_API_KEY: ${{ secrets.VITE_GAPGPT_API_KEY }}
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_GAPGPT_BASE_URL: ${{ vars.VITE_GAPGPT_BASE_URL }}
          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
        run: |
          set -eu

          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing VITE_SUPABASE_URL secret"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_ANON_KEY secret"
            exit 1
          fi

          GAPGPT_URL="${VITE_GAPGPT_BASE_URL:-https://api.gapgpt.app/v1}"
          AI_URL="${VITE_AI_BASE_URL:-$GAPGPT_URL}"

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
            printf 'VITE_GAPGPT_BASE_URL=%s\n' "$GAPGPT_URL"
            printf 'VITE_AI_BASE_URL=%s\n' "$AI_URL"

            if [ -n "$VITE_GAPGPT_API_KEY" ]; then
              printf 'VITE_GAPGPT_API_KEY=%s\n' "$VITE_GAPGPT_API_KEY"
            fi

            if [ -n "$VITE_AI_API_KEY" ]; then
              printf 'VITE_AI_API_KEY=%s\n' "$VITE_AI_API_KEY"
            fi
          } > .env

      - name: Build Application
        run: npm run build

      - name: Remove Environment File
        if: always()
        run: rm -f .env

      - name: Prepare GitHub Pages Files
        run: |
          set -eu

          if [ -f public/CNAME ] && [ ! -f dist/CNAME ]; then
            cp public/CNAME dist/CNAME
          fi

          if [ -f public/404.html ] && [ ! -f dist/404.html ]; then
            cp public/404.html dist/404.html
          fi

          echo "Build output:"
          ls -la dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
